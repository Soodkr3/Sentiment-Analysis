[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/F = pycodestyle errors + pyflakes; W = warnings; I = isort
select = ["E", "F", "W", "I"]
# Ignore line-length violations — the existing codebase has some long lines
# and we don't want to reformat aggressively in Stage 1.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tests use assert statements and relative imports freely
"tests/*" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
