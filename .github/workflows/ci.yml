name: CI

on:
  push:
    branches:
      - main
      - "claude/**"
  pull_request:
    branches:
      - main

jobs:
  # -----------------------------------------------------------------------
  # Backend: lint + test with coverage
  # -----------------------------------------------------------------------
  backend:
    name: Backend (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime + dev dependencies
        working-directory: backend
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint with ruff
        working-directory: backend
        run: ruff check .

      - name: Run tests with coverage
        working-directory: backend
        run: |
          pytest tests/ \
            --cov=enhanced_app \
            --cov-report=term-missing \
            --cov-fail-under=70 \
            -v

  # -----------------------------------------------------------------------
  # Frontend: install + build check
  # -----------------------------------------------------------------------
  frontend:
    name: Frontend (Node 18)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: Build
        working-directory: frontend
        run: npm run build
